global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: kpl-controller
    static_configs:
      - targets: [controller:8080]
  - job_name: kpl-agent
    static_configs:
      - targets: [agent-a:8090, agent-b:8090]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
