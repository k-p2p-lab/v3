services:
  controller:
    image: kpl-v3:local
    build: .
    command: ["controller", "--listen", ":8080", "--data-dir", "/var/lib/kpl/data"]
    environment:
      KPL_API_TOKEN: "${KPL_API_TOKEN:-}"
    ports:
      - "8080:8080"
    volumes:
      - controller-data:/var/lib/kpl/data
    networks: [peers]
    restart: unless-stopped

  agent-a:
    image: kpl-v3:local
    build: .
    user: "0:0"
    command:
      - agent
      - --id
      - agent-a
      - --name
      - Seoul A
      - --listen
      - :8090
      - --advertise-url
      - http://agent-a:8090
      - --self-url
      - http://agent-a:8090
      - --controller-url
      - http://controller:8080
      - --capacity
      - "50"
      - --data-dir
      - /var/lib/kpl/agent
      - --runtime
      - docker
      - --docker-image
      - kpl-v3:local
      - --docker-network
      - kpl-v3-peers
    environment:
      KPL_API_TOKEN: "${KPL_API_TOKEN:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [controller]
    networks: [peers]
    stop_grace_period: 3m
    restart: unless-stopped

  agent-b:
    image: kpl-v3:local
    build: .
    user: "0:0"
    command:
      - agent
      - --id
      - agent-b
      - --name
      - Seoul B
      - --listen
      - :8090
      - --advertise-url
      - http://agent-b:8090
      - --self-url
      - http://agent-b:8090
      - --controller-url
      - http://controller:8080
      - --capacity
      - "50"
      - --data-dir
      - /var/lib/kpl/agent
      - --runtime
      - docker
      - --docker-image
      - kpl-v3:local
      - --docker-network
      - kpl-v3-peers
    environment:
      KPL_API_TOKEN: "${KPL_API_TOKEN:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [controller]
    networks: [peers]
    stop_grace_period: 3m
    restart: unless-stopped

networks:
  peers:
    name: kpl-v3-peers
    driver: bridge

volumes:
  controller-data:
