services:
  controller:
    image: kpl-v3:local
    build: .
    command: ["controller", "--listen", ":8080", "--data-dir", "/var/lib/kpl/data"]
    environment:
      KPL_API_TOKEN: "${KPL_API_TOKEN:-}"
    ports:
      - "${KPL_BIND_ADDRESS:-127.0.0.1}:${KPL_HTTP_PORT:-8080}:8080"
    volumes:
      - controller-data:/var/lib/kpl/data
    networks: [peers, monitoring]
    stop_grace_period: 7m
    restart: unless-stopped

  agent-a:
    image: kpl-v3:local
    build: .
    user: "0:0"
    command:
      - agent
      - --id
      - agent-a
      - --name
      - Seoul A
      - --listen
      - :8090
      - --advertise-url
      - http://agent-a:8090
      - --self-url
      - http://agent-a:8090
      - --controller-url
      - http://controller:8080
      - --capacity
      - "50"
      - --data-dir
      - /var/lib/kpl/agent
      - --runtime
      - docker
      - --docker-image
      - kpl-v3:local
      - --docker-network
      - kpl-v3-peers
    environment:
      KPL_API_TOKEN: "${KPL_API_TOKEN:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [controller]
    networks: [peers, monitoring]
    stop_grace_period: 4m
    restart: unless-stopped

  agent-b:
    image: kpl-v3:local
    build: .
    user: "0:0"
    command:
      - agent
      - --id
      - agent-b
      - --name
      - Seoul B
      - --listen
      - :8090
      - --advertise-url
      - http://agent-b:8090
      - --self-url
      - http://agent-b:8090
      - --controller-url
      - http://controller:8080
      - --capacity
      - "50"
      - --data-dir
      - /var/lib/kpl/agent
      - --runtime
      - docker
      - --docker-image
      - kpl-v3:local
      - --docker-network
      - kpl-v3-peers
    environment:
      KPL_API_TOKEN: "${KPL_API_TOKEN:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [controller]
    networks: [peers, monitoring]
    stop_grace_period: 4m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoring]
    depends_on: [controller, agent-a, agent-b]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_ENABLED:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: en-US
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DATABASE_WAL: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kpl-experiments.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      start_period: 10m
      interval: 10s
      timeout: 5s
      retries: 6
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  peers:
    name: kpl-v3-peers
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  controller-data:
  prometheus-data:
  grafana-data:
